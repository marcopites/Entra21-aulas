<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="calcula()">Escrever mensagem!</button>

    <script>
        function calcula() {
            let z = 1;
            let logico = true;

            console.log(typeof z);       // "number"
            console.log(typeof logico);  // "boolean"
            console.log(z == logico);    // true  (coerção: true vira 1)
            console.log(z === logico);   // false (tipos diferentes)
        }
    </script>
</body>
</html>
