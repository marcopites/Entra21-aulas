<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto</title>
</head>
<body>
    <h1>Calculadora de Desconto</h1>

    <label for="valor">Valor do produto (R$)</label>
    <input id="valor" type="number" placeholder="Ex: 200">

    <label for="desconto">Desconto (%)</label>
    <input id="desconto" type="number" placeholder="Ex: 15">

    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

    <script>
        function calcular() {
            let valor = Number(document.getElementById("valor").value);
            let desconto = Number(document.getElementById("desconto").value);

            let valorDescontado = valor * (desconto / 100);
            let valorFinal = valor - valorDescontado;

            document.getElementById("resultado").innerHTML =
                "Desconto: R$ " + valorDescontado.toFixed(2) + "<br>" +
                "Valor final: R$ " + valorFinal.toFixed(2);
        }
    </script>
</body>
</html>
