<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
</head>
<body>
    <h1>Calculadora de Média</h1>

    <label for="nota1">Nota 1</label>
    <input id="nota1" type="number" placeholder="Ex: 6">

    <label for="nota2">Nota 2</label>
    <input id="nota2" type="number" placeholder="Ex: 5">

    <button onclick="calcularMedia()">Calcular média</button>

    <div id="areaRecuperacao" style="display: none;">
        <label for="recuperacao">Nota de recuperação</label>
        <input id="recuperacao" type="number" placeholder="Ex: 8">
        <button onclick="calcularRecuperacao()">Recalcular</button>
    </div>

    <p id="resultado"></p>

    <script>
        function calcularMedia() {
            let nota1 = Number(document.getElementById("nota1").value);
            let nota2 = Number(document.getElementById("nota2").value);

            let media = (nota1 + nota2) / 2;

            if (media >= 7) {
                document.getElementById("resultado").textContent =
                    "Média: " + media.toFixed(1) + " - Aprovado!";
                document.getElementById("areaRecuperacao").style.display = "none";
            } else {
                document.getElementById("resultado").textContent =
                    "Média: " + media.toFixed(1) + " - Faça a recuperação.";
                document.getElementById("areaRecuperacao").style.display = "block";
            }
        }

        function calcularRecuperacao() {
            let nota1 = Number(document.getElementById("nota1").value);
            let nota2 = Number(document.getElementById("nota2").value);
            let recuperacao = Number(document.getElementById("recuperacao").value);

            let mediaOriginal = (nota1 + nota2) / 2;
            let mediaFinal = (mediaOriginal + recuperacao) / 2;

            if (mediaFinal >= 7) {
                document.getElementById("resultado").textContent =
                    "Média final: " + mediaFinal.toFixed(1) + " - Aprovado!";
            } else {
                document.getElementById("resultado").textContent =
                    "Média final: " + mediaFinal.toFixed(1) + " - Reprovado.";
            }
        }
    </script>
</body>
</html>
