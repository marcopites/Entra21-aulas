<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Número Primo</title>
</head>
<body>
    <h1>Verificador de Número Primo</h1>

    <label for="numero">Número</label>
    <input id="numero" type="number" placeholder="Ex: 7">

    <button onclick="verificar()">Verificar</button>

    <p id="resultado"></p>

    <script>
        function verificar() {
            let numero = Number(document.getElementById("numero").value);

            let ehPrimo = true;

            if (numero < 2) {
                ehPrimo = false;
            } else {
                for (let i = 2; i < numero; i++) {
                    if (numero % i === 0) {
                        ehPrimo = false;
                        break;
                    }
                }
            }

            if (ehPrimo) {
                document.getElementById("resultado").textContent = numero + " é primo.";
            } else {
                document.getElementById("resultado").textContent = numero + " não é primo.";
            }
        }
    </script>
</body>
</html>
