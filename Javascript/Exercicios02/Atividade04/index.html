<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercicio 04 - Checkbox de Termos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Exercicio 04: Checkbox de Termos</h1>

    <form id="meuForm">
      <div class="linha-checkbox">
        <input type="checkbox" id="aceite" name="aceite">
        <label for="aceite">Li e aceito os termos de uso</label>
      </div>

      <!-- Botao comeca DESABILITADO (atributo disabled no HTML) -->
      <button type="submit" id="btnEnviar" disabled>Enviar</button>
    </form>
  </main>

  <!-- Script no final do body: garante que o DOM ja foi carregado -->
  <script src="script.js"></script>
</body>
</html>
