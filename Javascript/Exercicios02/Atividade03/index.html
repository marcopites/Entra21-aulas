<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercicio 03 - Validacao de Email</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Exercicio 03: Validacao de Email</h1>

    <form id="meuForm">
      <label for="email">E-mail:</label>
      <input type="text" id="email" name="email" placeholder="Digite seu e-mail...">

      <!-- Elemento que vai receber a mensagem de erro -->
      <span id="erroEmail" class="msg-erro"></span>

      <button type="submit">Enviar</button>
    </form>
  </main>

  <!-- Script no final do body: garante que o DOM ja foi carregado -->
  <script src="script.js"></script>
</body>
</html>
